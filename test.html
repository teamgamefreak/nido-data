<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pika-Master</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; margin: 0; padding: 2px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
        .app-header { text-align: center; font-size: 16px; font-weight: bold; background: #1e1e1e; padding: 10px; color: #ffcc00; margin-bottom: 2px; flex-shrink: 0; }
        .controls { display: flex; justify-content: space-around; padding: 4px; background: #1e1e1e; border-radius: 6px; margin-bottom: 2px; flex-shrink: 0; height: 32px; align-items: center; }
        .filter-btn { padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: bold; }
        .filter-btn.active { background: #ffcc00; color: #000; }

        #binder { 
            display: flex !important; 
            flex-wrap: wrap !important;
            align-content: flex-start !important;
            width: 100vw !important; 
            height: 99vh !important; 
            padding: 0 !important; 
            margin: 0 !important;
            background: #0a0a0a !important;
            overflow: hidden !important; 
            box-sizing: border-box !important;
        }
        .card { 
            position: relative !important; 
            flex: 0 0 25% !important;
            max-width: 25% !important;
            height: 25vh !important; 
            background: #1a1a1a !important; 
            display: flex !important; 
            flex-direction: column !important; 
            align-items: center !important; 
            justify-content: center !important; 
            border: 1px solid #333 !important; 
            box-sizing: border-box !important; 
            overflow: hidden !important; 
            padding: 2px !important;
        }
        .card.owned { border: 3px solid #4caf50 !important; }
        .card.missing { border: 3px solid #f44336 !important; }
        .card img { 
            width: auto !important;
            height: auto !important;
            max-width: 95% !important;
            max-height: 75% !important;
            object-fit: contain !important; 
            display: block !important;
        }
        .card-name { 
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 25% !important;
            font-size: 9px !important; 
            font-weight: bold !important; 
            color: #ffffff !important; 
            background: rgba(40, 40, 40, 0.85) !important; 
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding: 0 2px !important;
            overflow: hidden !important; 
            text-overflow: ellipsis !important; 
            white-space: nowrap !important; 
            pointer-events: none !important;
            box-sizing: border-box !important;
        }

        #lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .lb-box { background: #222; padding: 30px 20px; border-radius: 14px; text-align: center; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; border: 2px solid #ffcc00; box-sizing: border-box; }
        .lb-btn { padding: 16px 24px; margin: 12px 0; width: 100%; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-header">Pika-Master</div>
    <div style="padding: 5px;">
        <input type="text" id="search-input" placeholder="Suche..." oninput="filterData()" style="width: 100%; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;">
    </div>
    <div class="controls">
        <button class="filter-btn active" id="f-all" onclick="setFilter('all')">Alle (<span id="n-all">0</span>)</button>
        <button class="filter-btn" id="f-owned" onclick="setFilter('owned')">Besitz (<span id="n-owned">0</span>)</button>
        <button class="filter-btn" id="f-missing" onclick="setFilter('missing')">Fehlend (<span id="n-missing">0</span>)</button>
    </div>

    <div id="binder" class="binder-page"></div>
    <div id="page-indicator" style="text-align: center; color: #fff; font-size: 14px; padding: 10px 0; font-weight: bold;">Seite 1 / 1</div>

    <div id="lightbox" onclick="this.style.display='none'">
        <div class="lb-box" onclick="event.stopPropagation()">
            <h2 id="lb-title">Info</h2>
            <button class="lb-btn" id="lb-status-btn" onclick="toggleOwnership()"></button>
            <div id="lb-details" style="margin-top: 15px; color: #fff; font-size: 14px;"></div>
        </div>
    </div>

    <script src="capacitor.js"></script>
    <script>
        const SUPABASE_URL = "https://ciwuqspejmsaxwpibyjj.supabase.co";
        const SUPABASE_KEY = "eyJhbG...Q6vY";

        let allData = [];
        let filter = 'all';
        let page = 0;
        let activeId = null;
        let searchTerm = '';

        function getImageUrl(card) {
            return `https://raw.githubusercontent.com/teamgamefreak/pikachu-images/main/images/${card.image}`;
        }

        async function init() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/cards?select=*`, {
                    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
                });
                allData = await res.json();
                allData.sort((a, b) => a.id.localeCompare(b.id));
            } catch (e) {
                console.error("Supabase failed", e);
            }
            render();
            
            // Regelmäßiges Polling alle 5 Sekunden, um Änderungen in der Datenbank zu erkennen
            setInterval(checkForChanges, 5000);
        }

        async function checkForChanges() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/cards?select=id,owned`, {
                    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
                });
                const newData = await res.json();
                if (newData.length !== allData.length) {
                    location.reload();
                    return;
                }
                for (let i = 0; i < newData.length; i++) {
                    const current = allData.find(c => c.id === newData[i].id);
                    if (!current || current.owned !== newData[i].owned) {
                        location.reload();
                        return;
                    }
                }
            } catch (e) {
                console.error("Polling error:", e);
            }
        }

        function filterData() {
            searchTerm = document.getElementById('search-input').value.toLowerCase();
            page = 0;
            render();
        }

        function getFilteredList() {
            let filtered = filter === 'all' ? allData : allData.filter(c => filter === 'owned' ? c.owned : !c.owned);
            if (searchTerm) {
                filtered = filtered.filter(c => 
                    (c.set && c.set.toLowerCase().includes(searchTerm)) || 
                    (c.number && c.number.toString().toLowerCase().includes(searchTerm)) ||
                    (c.kürzel && c.kürzel.toLowerCase().includes(searchTerm)) ||
                    (c.id && c.id.toLowerCase().includes(searchTerm))
                );
            }
            return filtered;
        }

        function render() {
            const filtered = getFilteredList();
            const container = document.getElementById('binder');
            container.innerHTML = '';
            const start = page * 12;
            filtered.slice(start, start + 12).forEach((card, idx) => {
                const div = document.createElement('div');
                div.className = 'card ' + (card.owned ? 'owned' : 'missing');
                div.innerHTML = '<img src="' + getImageUrl(card) + '"><div class="card-name">' + card.set + '</div>';
                div.onclick = () => {
                    activeId = card.id; 
                    const lbTitle = document.getElementById('lb-title');
                    const lbDetails = document.getElementById('lb-details');
                    const lbStatusBtn = document.getElementById('lb-status-btn');

                    lbTitle.innerText = `${card.set || 'Pikachu'} ${card.number || '---'}`;

                    if (card.owned) {
                        lbStatusBtn.innerText = "✗ Entfernen";
                        lbStatusBtn.style.background = "#f44336";
                    } else {
                        lbStatusBtn.innerText = "✓ Hinzufügen";
                        lbStatusBtn.style.background = "#4caf50";
                    }
                    lbStatusBtn.onclick = () => { toggleOwnership(); };

                    let details = `<div style="font-size: 15px; line-height: 1.6;">Set: <b>${card.set || 'N/A'}</b><br>`;
                    if (card.edition && card.edition !== 'non') {
                        details += `Edition: <b>${card.edition}</b><br>`;
                    }
                    details += `Rarität: <b>${card.rarity || 'N/A'}</b><br>`;
                    details += `Release: <b>${card.release || 'N/A'}</b><br>`;
                    details += `Illustrator: <b>${card.illustrator || 'N/A'}</b></div>`;

                    const cmQuery = encodeURIComponent(`${card.kürzel || 'Pikachu'}${card.number || ''}`);
                    details += `<button class="lb-btn" style="background: #3498db; color: white; margin-top: 15px;" onclick="window.open('https://www.cardmarket.com/de/Pokemon/Products/Search?searchString=${cmQuery}', '_blank')">Cardmarket Suche</button>`;

                    lbDetails.innerHTML = details;
                    document.getElementById('lightbox').style.display='flex'; 
                };
                container.appendChild(div);
            });
            document.getElementById('n-all').innerText = allData.length;
            document.getElementById('n-owned').innerText = allData.filter(c => c.owned).length;
            document.getElementById('n-missing').innerText = allData.filter(c => !c.owned).length;

            const maxPage = Math.max(0, Math.ceil(filtered.length / 12) - 1);
            document.getElementById('page-indicator').innerText = `Seite ${page + 1} / ${maxPage + 1}`;
        }

        async function toggleOwnership() {
            const card = allData.find(c => c.id === activeId);
            const newVal = !card.owned;
            await setOwnership(newVal);
            const lbStatusBtn = document.getElementById('lb-status-btn');
            if (newVal) {
                lbStatusBtn.innerText = "✗ Entfernen";
                lbStatusBtn.style.background = "#f44336";
            } else {
                lbStatusBtn.innerText = "✓ Hinzufügen";
                lbStatusBtn.style.background = "#4caf50";
            }
        }

        async function setOwnership(val) {
            const card = allData.find(c => c.id === activeId);
            card.owned = val;
            render();
            await fetch(`${SUPABASE_URL}/rest/v1/cards?id=eq.${card.id}`, {
                method: 'PATCH',
                headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json'},
                body: JSON.stringify({ owned: val })
            });
        }

        function setFilter(f) { filter = f; page = 0; document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === 'f-'+f)); render(); }

        let xDown = null;
        document.addEventListener('touchstart', e => xDown = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            if(!xDown) return;
            const diff = xDown - e.changedTouches[0].clientX;
            if(Math.abs(diff) > 50) {
                const filtered = getFilteredList();
                const maxPage = Math.max(0, Math.ceil(filtered.length / 12) - 1);

                if(diff > 0) {
                    page = Math.min(maxPage, page + 1);
                } else {
                    page = Math.max(0, page - 1);
                }
                render();
            }
            xDown = null;
        });

        window.onload = init;
    </script>
</body>
</html>
